[package]
name = "ebook-reader"
version = "0.1.0"
description = "Personal knowledge workspace — ebook reader + annotation + notes"
authors = ["Tai PM"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ebook_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
epub = "2"

[dev-dependencies]
# Property-based testing for CanonicalLocation round-trip
proptest = "1"
